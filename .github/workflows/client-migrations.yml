name: UpstreamFix client migrations

on:
  workflow_call:
    inputs:
      upstreamfix_sha:
        description: Reviewed 40-character commit of ivanDev237/upstreamfix
        required: true
        type: string
      ci_workflow:
        description: Optional client workflow filename to dispatch on the verified migration branch
        required: false
        type: string
  workflow_dispatch:
    inputs:
      upstreamfix_sha:
        description: Reviewed 40-character commit of ivanDev237/upstreamfix
        required: true
        type: string
      ci_workflow:
        description: Optional client workflow filename to dispatch on the verified migration branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upstreamfix-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha == github.sha && github.event.client_payload.branch == github.event.repository.default_branch && format('{0}', github.event.client_payload.repository_id) == format('{0}', github.event.repository.id) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Validate immutable source reference
        shell: bash
        env:
          UPSTREAMFIX_SOURCE_SHA: ${{ inputs.upstreamfix_sha }}
        run: |
          [[ "$UPSTREAMFIX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'upstreamfix_sha must be a 40-character commit'; exit 1; }
      - name: Checkout client repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: client
      - name: Checkout reviewed UpstreamFix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivanDev237/upstreamfix
          ref: ${{ inputs.upstreamfix_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: tool
      - name: Refuse tool commits outside main or a release tag
        shell: bash
        run: |
          if ! git -C tool merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            [[ -n "$(git -C tool tag --points-at HEAD --list 'v[0-9]*')" ]] || { echo 'Tool SHA is not on main or a release tag'; exit 1; }
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install reviewed tool without lifecycle scripts
        working-directory: tool
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Prepare pinned verification image quietly
        run: docker pull --quiet node:24.22.0-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
      - name: Analyze, verify and bundle migrations without a write token
        env:
          UPSTREAMFIX_CLIENT_ROOT: ${{ github.workspace }}/client
          UPSTREAMFIX_OUTPUT_ROOT: ${{ runner.temp }}/upstreamfix-output
          UPSTREAMFIX_BASE_SHA: ${{ github.sha }}
          UPSTREAMFIX_CONTAINER_VERIFY: '1'
          # Canary exists in the tool process, but must never enter client tests.
          UPSTREAMFIX_TRAP_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-client-canary
          GIT_AUTHOR_NAME: upstreamfix[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: upstreamfix[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node tool/dist/action/migrate-cli.js
      - name: Upload bounded migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstreamfix-proposals
          path: ${{ runner.temp }}/upstreamfix-output
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: migrate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha == github.sha && github.event.client_payload.branch == github.event.repository.default_branch && format('{0}', github.event.client_payload.repository_id) == format('{0}', github.event.repository.id) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Validate immutable source reference
        shell: bash
        env:
          UPSTREAMFIX_SOURCE_SHA: ${{ inputs.upstreamfix_sha }}
        run: |
          [[ "$UPSTREAMFIX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'upstreamfix_sha must be a 40-character commit'; exit 1; }
      - name: Checkout reviewed UpstreamFix source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivanDev237/upstreamfix
          ref: ${{ inputs.upstreamfix_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: tool
      - name: Refuse tool commits outside main or a release tag
        shell: bash
        run: |
          if ! git -C tool merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            [[ -n "$(git -C tool tag --points-at HEAD --list 'v[0-9]*')" ]] || { echo 'Tool SHA is not on main or a release tag'; exit 1; }
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install reviewed publisher without lifecycle scripts
        working-directory: tool
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Download migration artifact outside the workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/upstreamfix-input"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name upstreamfix-proposals --dir "$RUNNER_TEMP/upstreamfix-input"
      - name: Validate bundle and publish PRs or issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAMFIX_INPUT_ROOT: ${{ runner.temp }}/upstreamfix-input
          UPSTREAMFIX_REPOSITORY: ${{ github.repository }}
          UPSTREAMFIX_BASE_SHA: ${{ github.sha }}
          UPSTREAMFIX_CLIENT_CI_WORKFLOW: ${{ inputs.ci_workflow }}
        run: node tool/dist/action/publish-cli.js
