name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to retry, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: Verify release and build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure the tag points to main history
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the release is explicitly enabled
        env:
          RELEASE_ENABLED: ${{ vars.UPSTREAMFIX_RELEASE_ENABLED }}
        run: |
          if [[ "$RELEASE_ENABLED" != "true" ]]; then
            echo "Publishing is locked. Complete P1.2, the independent P1.6 review, and P1.7; configure the protected npm-production environment and npm trusted publishing; then set UPSTREAMFIX_RELEASE_ENABLED=true."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check tag and package versions match
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts --json | node scripts/check-package-files.mjs
      - name: Build the package archive without lifecycle scripts
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: upstreamfix-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified archive
    needs: build
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish stable or prerelease channel with provenance
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish ./*.tgz --ignore-scripts --provenance --access public --tag next --loglevel=verbose
          else
            npm publish ./*.tgz --ignore-scripts --provenance --access public --tag latest --loglevel=verbose
          fi
