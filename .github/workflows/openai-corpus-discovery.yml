name: OpenAI v4 corpus discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/openai-corpus-discovery.yml'
      - 'scripts/discover-openai-corpus.mjs'
      - 'benchmark/openai-5-repos.json'

permissions:
  contents: read

concurrency:
  group: openai-corpus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Find public OpenAI v4 usage candidates without local downloads
        id: discovery
        continue-on-error: true # External indexes may rate-limit CI; the script itself still exits nonzero.
        env:
          UPSTREAMFIX_CORPUS_CANDIDATES: ${{ runner.temp }}/openai-corpus-candidates.json
        run: node scripts/discover-openai-corpus.mjs
      - name: Record unavailable discovery
        if: steps.discovery.outcome == 'failure'
        run: |
          echo 'OpenAI corpus discovery failed: both public search providers were unavailable. No new repositories were qualified; review the discovery log before claiming corpus coverage.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unreviewed candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openai-corpus-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/openai-corpus-candidates.json
          if-no-files-found: warn
          retention-days: 7
