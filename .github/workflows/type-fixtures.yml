name: Type-derived SDK fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/type-fixtures.yml'
      - 'src/core/type-fixtures.ts'
      - 'src/core/diff-api.ts'
      - 'src/migrations/firebase-admin-v14/**'
      - 'scripts/run-type-fixtures.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_call:
    inputs:
      source_sha:
        description: Exact reviewed UpstreamFix source commit
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed UpstreamFix source commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: type-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate immutable source reference
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivanDev237/upstreamfix
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          path: tool
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - working-directory: tool
        run: npm ci --ignore-scripts
      - name: Compile generated fixtures against exact SDK versions
        env:
          UPSTREAMFIX_FIXTURE_REPORT: ${{ runner.temp }}/type-fixtures.md
          UPSTREAMFIX_DIFF_DIR: ${{ runner.temp }}
        working-directory: tool
        run: npx tsx scripts/run-type-fixtures.ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: type-fixtures-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/type-fixtures.md
            ${{ runner.temp }}/api-diff-*.json
            ${{ runner.temp }}/fixture-lock-*.json
          if-no-files-found: warn
          retention-days: 30
