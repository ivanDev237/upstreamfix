name: Public repository benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'src/migrations/openai-v5/**'
      - 'src/migrations/index.ts'
      - 'src/core/runner.ts'
      - 'scripts/benchmark.ts'
      - 'benchmark/openai-5-repos.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      migration:
        description: Reviewed migration corpus to run
        required: true
        type: choice
        default: stripe@23
        options:
          - firebase-admin@14
          - stripe@22
          - stripe@23
          - openai@5
      repository:
        description: Optional exact repository name from the selected corpus; leave empty for all
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ github.event_name == 'pull_request' && 'openai@5' || inputs.migration }} public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install UpstreamFix without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check Docker and available memory
        run: |
          docker info --format 'Docker server {{.ServerVersion}}'
          free -m
      - name: Run reviewed corpus in isolated containers
        shell: bash
        env:
          BENCHMARK_MIGRATION: ${{ github.event_name == 'pull_request' && 'openai@5' || inputs.migration }}
          BENCHMARK_REPOSITORY: ${{ inputs.repository }}
          BENCHMARK_REPORT: ${{ runner.temp }}/upstreamfix-benchmark.md
          UPSTREAMFIX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--migration "$BENCHMARK_MIGRATION" --memory-mb 4096 --report "$BENCHMARK_REPORT" --yes)
          if [[ "$BENCHMARK_MIGRATION" == 'openai@5' ]]; then
            args+=(--repos benchmark/openai-5-repos.json)
          fi
          if [[ -n "$BENCHMARK_REPOSITORY" ]]; then
            args+=(--only "$BENCHMARK_REPOSITORY")
          fi
          npm run benchmark -- "${args[@]}"
      - name: Upload report, including partial results after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report-${{ github.run_id }}
          path: ${{ runner.temp }}/upstreamfix-benchmark.md
          if-no-files-found: warn
          retention-days: 30
