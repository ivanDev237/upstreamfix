name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify lockfile regeneration with registry access
        run: npx vitest run test/firebase-admin-v14.test.ts -t "regenerates a v3 npm package lock"
        env:
          UPSTREAMFIX_RUN_LOCKFILE_NETWORK_TESTS: '1'
      - name: Verify Firebase migration against published SDK releases
        run: npx vitest run test/firebase-admin-real-sdk.test.ts
        env:
          UPSTREAMFIX_RUN_REAL_SDK_TESTS: '1'
      - name: Verify Stripe migrations against published SDK releases
        run: npx vitest run test/stripe-real-sdk.test.ts
        env:
          UPSTREAMFIX_RUN_REAL_SDK_TESTS: '1'
