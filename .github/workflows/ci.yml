name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 with verified archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint every workflow
        run: actionlint -color
  checks:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify lockfile regeneration with registry access
        run: npx vitest run test/firebase-admin-v14.test.ts -t "regenerates a v3 npm package lock"
        env:
          UPSTREAMFIX_RUN_LOCKFILE_NETWORK_TESTS: '1'
      - name: Validate a real Firebase npm lockfile at the publication boundary
        run: npx vitest run test/action-publish.test.ts -t "validates a real firebase-admin 13 to 14 npm lockfile upgrade"
        env:
          UPSTREAMFIX_RUN_LOCKFILE_NETWORK_TESTS: '1'
          UPSTREAMFIX_LOCK_FIXTURE_OUTPUT: ${{ runner.temp }}/firebase-lock-fixture
      - name: Preserve exact npm-generated lockfile fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-lock-fixture-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/firebase-lock-fixture
          if-no-files-found: error
          retention-days: 7
      - name: Verify Firebase migration against published SDK releases
        run: npx vitest run test/firebase-admin-real-sdk.test.ts
        env:
          UPSTREAMFIX_RUN_REAL_SDK_TESTS: '1'
      - name: Compare published Firebase declarations
        run: npx vitest run test/diff-api-real-sdk.test.ts
        env:
          UPSTREAMFIX_RUN_REAL_SDK_TESTS: '1'
      - name: Verify Stripe migrations against published SDK releases
        run: npx vitest run test/stripe-real-sdk.test.ts
        env:
          UPSTREAMFIX_RUN_REAL_SDK_TESTS: '1'
