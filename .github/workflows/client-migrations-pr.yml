name: Client Action PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/client-migrations-pr.yml'
      - '.github/workflows/client-migrations.yml'
      - 'action.yml'
      - 'src/action/**'
      - 'src/core/**'
      - 'src/migrations/**'
      - 'test/action-*.test.ts'
      - 'examples/action-test/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: client-migrations-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install and test npm, pnpm and Yarn in disposable Docker containers
        run: node scripts/check-client-containers.mjs
      - name: Prove the client container timeout kills a long running command
        run: node scripts/check-client-timeout.mjs
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test client Action safety and publication decisions
        run: npx vitest run --maxWorkers=1 test/action-config.test.ts test/action-migrate.test.ts test/action-publish.test.ts test/action-workflow.test.ts test/verify.test.ts
