name: UpstreamFix migration preparation
description: Prepare verified migration bundles in a read-only GitHub Actions job. Use the reusable workflow to publish PRs.
inputs:
  output:
    description: Absolute path outside the checkout for proposals and bundles
    required: true
runs:
  using: composite
  steps:
    - name: Enforce safe event and checkout
      shell: bash
      env:
        UPSTREAMFIX_EVENT: ${{ github.event_name }}
      run: |
        [[ "$UPSTREAMFIX_EVENT" == 'schedule' || "$UPSTREAMFIX_EVENT" == 'workflow_dispatch' ]] || { echo 'Only schedule and workflow_dispatch are supported'; exit 1; }
        [[ -z "${GITHUB_TOKEN:-}" && -z "${GH_TOKEN:-}" ]] || { echo 'A token is present in the migration environment'; exit 1; }
    - name: Install reviewed action without lifecycle scripts
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH" && npm run build --prefix "$GITHUB_ACTION_PATH"
    - name: Pull pinned verification image
      shell: bash
      run: docker pull --quiet node:24.22.0-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    - name: Prepare migrations in a read-only job
      shell: bash
      env:
        UPSTREAMFIX_OUTPUT_ROOT: ${{ inputs.output }}
        UPSTREAMFIX_CLIENT_ROOT: ${{ github.workspace }}
        UPSTREAMFIX_BASE_SHA: ${{ github.sha }}
        UPSTREAMFIX_CONTAINER_VERIFY: '1'
        GIT_AUTHOR_NAME: upstreamfix[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: upstreamfix[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: node "$GITHUB_ACTION_PATH/dist/action/migrate-cli.js"
